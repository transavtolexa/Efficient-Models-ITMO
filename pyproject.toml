[project]
name = "efficient-models-itmo"
version = "0.1.0"
description = "Coursework for the Efficient Models course at ITMO University"
readme = "ReadMe.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib>=3.10,<4.0",
    "numpy>=2.0,<3.0",
    "nvidia-ml-py>=12,<14",
    "pandas>=2.2,<4.0",
    "scipy>=1.15,<2.0",
    "torch>=2.7,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
